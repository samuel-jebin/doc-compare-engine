<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Upload & Compare Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }
        h2, h3 {
            color: #333;
        }
        input, button {
            padding: 10px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .section {
            margin-bottom: 40px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 30px;
        }
        #result {
            margin-top: 10px;
            padding: 10px;
            background: #f2f2f2;
            border: 1px solid #ccc;
            white-space: pre-wrap;
        }
        iframe {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            border: 1px solid #aaa;
        }
    </style>
</head>
<body>

    <!-- Section 1: Upload to Blob -->
    <div class="section">
        <h2>1. Upload PDF to Blob Storage</h2>
        <form id="uploadBlobForm">
            <input type="file" id="blobPdfFile" name="file" accept="application/pdf" required>
            <br>
            <button type="submit">Upload to Blob</button>
        </form>
        <p id="blobResponse"></p>
    </div>

    <!-- Section 2: Upload for Comparison -->
    <div class="section">
        <h2>2. Upload PDF for Comparison</h2>
        <form id="uploadCompareForm">
            <input type="file" id="comparePdfFile" name="file" accept="application/pdf" required>
            <br>
            <button type="submit">Upload & Compare</button>
        </form>

        <div>
            <h3>Comparison Result:</h3>
            <div id="compareResult">Waiting for upload...</div>

            <h3>Generated HTML Content:</h3>
            <iframe id="htmlViewer"></iframe>
        </div>
    </div>

    <script>
        // Upload to Blob logic
        const uploadBlobForm = document.getElementById('uploadBlobForm');
        const blobResponseText = document.getElementById('blobResponse');

        uploadBlobForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const fileInput = document.getElementById('blobPdfFile');
            const file = fileInput.files[0];

            if (!file) {
                blobResponseText.innerText = "Please select a file.";
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://127.0.0.1:8000/json_to_blob', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    blobResponseText.innerText = result.Message;
                } else {
                    blobResponseText.innerText = `Error: ${result.message || result.error}`;
                }
            } catch (error) {
                blobResponseText.innerText = "An error occurred: " + error.message;
            }
        });

        // Upload and Compare logic
        const uploadCompareForm = document.getElementById('uploadCompareForm');
        const compareResult = document.getElementById('compareResult');
        const htmlViewer = document.getElementById('htmlViewer');

        uploadCompareForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const fileInput = document.getElementById('comparePdfFile');
            const file = fileInput.files[0];

            if (!file) {
                compareResult.innerText = "Please select a file.";
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://127.0.0.1:8000/upload_and_process', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    compareResult.innerText = data.comparison_result;
                    htmlViewer.srcdoc = data.html_content;
                } else {
                    compareResult.innerText = "Error: " + (data.error || "Unknown error.");
                }
            } catch (error) {
                compareResult.innerText = "An error occurred: " + error.message;
            }
        });
    </script>

</body>
</html>
